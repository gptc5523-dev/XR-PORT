<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>등록된 사용자</title></head>
<body>
<h3>등록된 사용자</h3>
<table border="1" cellpadding="4"><thead><tr><th>기기 ID</th><th>종류</th><th>별칭</th><th>이름</th><th>직급</th><th>소속</th><th>역할</th><th>방장</th><th>색</th><th>비고</th><th>사용</th></tr></thead><tbody id="list"></tbody></table>
<script>
const cols = ['device_id','device_type','device_label','name','position','department','role','can_host','color','memo','active'];
fetch('/users?all=1').then(r => r.json()).then(j => j.users.forEach(u => {
  const tr = document.createElement('tr');
  cols.forEach(k => {
    const td = document.createElement('td');
    td.textContent = k === 'can_host' || k === 'active' ? (u[k] ? '예' : '아니오') : (u[k] ?? '');
    if (k === 'color') td.style.color = u[k];
    tr.appendChild(td);
  });
  document.getElementById('list').appendChild(tr);
}));
</script>
</body>
</html>
