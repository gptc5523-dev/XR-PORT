# 통합서버 설치본(WBS 8.2) — Server/install.sh 가 이 파일과 app/ 을 설치 폴더에 놓고 docker compose up -d 한다. 값은 같은 폴더의 .env(XRCRANE_ALLOW_EXTRA·XRCRANE_RETAIN_HOURS·XRCRANE_USERS_FILE, 개발용 XRCRANE_TOKEN — 납품본은 토큰 없음).
services:
  xrcrane-db:
    image: python:3.12-slim
    container_name: xrcrane-db
    restart: unless-stopped
    command: ["python", "/app/xrcrane_db.py", "--db", "/data/xrcrane.db", "serve"]
    ports: ["5006:5006"]
    environment:
      XRCRANE_USERS: /etc/xrcrane-users.json
      XRCRANE_ALLOW: ${XRCRANE_ALLOW:-}   # 비면 코드 기본(루프백·사설망·Tailscale VPN)
      XRCRANE_ALLOW_EXTRA: ${XRCRANE_ALLOW_EXTRA:-}   # 현장 추가 대역(install.sh --allow)
      XRCRANE_TOKEN: ${XRCRANE_TOKEN:-}
      XRCRANE_RETAIN_HOURS: ${XRCRANE_RETAIN_HOURS:-3}
    volumes:
      - ./app:/app:ro
      - ./data:/data
      - ${XRCRANE_USERS_FILE:-./users.json}:/etc/xrcrane-users.json:ro
      - ${XRCRANE_LICENSE_FILE:-./license.json}:/etc/xrcrane-license.json:ro   # 서버 라이선스(WBS 8.3) — 공급사 서명본, 없으면 '{}' = 평가판(크레인 1대)

  # 라이브 가상 PLC — 실 PLC(㈜엠비이)가 붙으면 이 서비스 대신 plc_s7.py adapter 를 띄운다.
  xrcrane-plc:
    image: python:3.12-slim
    container_name: xrcrane-plc
    restart: unless-stopped
    network_mode: host
    command: ["python", "-u", "/app/live.py", "--url", "http://127.0.0.1:5006", "--layout", "/app/live_layout.json"]
    environment:
      XRCRANE_TOKEN: ${XRCRANE_TOKEN:-}
    volumes:
      - ./app:/app:ro
    depends_on: [xrcrane-db]

  # 상태 요약 추론(WBS 6.4) — xrcrane-db 기록을 1초마다 읽어 판정, xrcrane-db 의 /summary 가 이리로 넘긴다(포트는 내부만).
  #   모델·휠은 학습 폴더(~/xrcrane-ai: models/·wheels/)를 그대로 쓴다 — 폐쇄망이라 pip 은 휠 폴더에서만 설치.
  xrcrane-ai:
    image: python:3.12-slim
    container_name: xrcrane-ai
    restart: unless-stopped
    command: ["sh", "-c", "pip install -q --no-index --find-links /wheels numpy==2.2.6 scikit-learn==1.7.2 && exec python -u /app/serve_ai.py"]
    environment:
      XRCRANE_DB_URL: http://xrcrane-db:5006
      XRCRANE_TOKEN: ${XRCRANE_TOKEN:-}
      XRCRANE_AI_MODELS: /models
      XRCRANE_AI_SET: ${XRCRANE_AI_SET:-full}
    volumes:
      - ./app:/app:ro
      - ${XRCRANE_AI_DIR:-../xrcrane-ai}/models:/models:ro
      - ${XRCRANE_AI_DIR:-../xrcrane-ai}/wheels:/wheels:ro
    depends_on: [xrcrane-db]
